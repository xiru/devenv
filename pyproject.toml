[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devenv-check"
version = "0.2.0"
description = "Check a computer for Bash, Java/Kotlin/Gradle, Go, Rust, Node/TypeScript, C/C++, C#, Docker, Kubernetes, Git and VS Code development tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
devenv-check = "devenv_check.cli:main"

[tool.setuptools]
packages = ["devenv_check"]
